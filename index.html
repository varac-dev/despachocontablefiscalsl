    <div id="root"></div>

    <script>
      /* Medición GA4: secciones vistas, profundidad de scroll y permanencia (solo informativos; la conversión sigue siendo el clic a WhatsApp/tel). El observar() se reintenta a los 3s y 8s porque React renderiza las secciones después de load. */
      (function(){
        var CITY='Home';
        var fired={};
        function ev(n,p){try{if(window.gtag){p=p||{};p.page_city=CITY;gtag('event',n,p);}}catch(e){}}
        function once(k,fn){if(!fired[k]){fired[k]=1;fn();}}
        function nombre(s,i){return s.id||((s.className||'').trim().split(/\s+/).pop())||(s.tagName==='FOOTER'?'footer':'seccion_'+i);}
        var io=null;
        function observar(){
          if(!('IntersectionObserver' in window))return;
          var secs=document.querySelectorAll('section,footer');
          if(!secs.length)return;
          if(!io){io=new IntersectionObserver(function(es){
            es.forEach(function(e){
              if(e.isIntersecting){
                var n=e.target.getAttribute('data-mide');
                once('s_'+n,function(){ev('seccion_vista',{seccion:n});});
                io.unobserve(e.target);
              }
            });
          },{threshold:0.25});}
          Array.prototype.forEach.call(secs,function(s,i){
            if(s.getAttribute('data-mide'))return;
            s.setAttribute('data-mide',nombre(s,i));
            io.observe(s);
          });
        }
        function pct(){
          var h=document.documentElement,b=document.body;
          var st=h.scrollTop||b.scrollTop,sh=(h.scrollHeight||b.scrollHeight)-h.clientHeight;
          return sh>0?st/sh*100:0;
        }
        window.addEventListener('scroll',function(){
          var p=pct();
          if(p>=50)once('sc50',function(){ev('scroll_medio',{porcentaje:50});});
          if(p>=90)once('sc90',function(){ev('scroll_profundo',{porcentaje:90});});
        },{passive:true});
        setTimeout(function(){once('t30',function(){ev('tiempo_30s');});},30000);
        if(document.readyState==='complete'){observar();}else{window.addEventListener('load',observar);}
        setTimeout(observar,3000);
        setTimeout(observar,8000);
      })();
    </script>
